name: Verify

on:
  pull_request:
  push:
    branches:
      - main
      - "feature/**"
      - "bugfix/**"
      - "chore/**"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Ensure release base ref exists
        run: git branch --force main origin/main
      - name: Run policy and release verification
        run: npm run verify:release -- main
